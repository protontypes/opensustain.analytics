name: Update OpenSustain Data

# Rebuilds data/*.csv from ecosyste.ms whenever README.md changes in
# open-sustainable-technology (its notify-downstream workflow sends
# ost-readme-updated), plus daily: ecosyste.ms picks up newly listed projects
# on its own schedule, so a run right after a merge often doesn't include the
# new project's metrics yet. publish-payloads.yml runs after this and rebuilds
# the site.
on:
  repository_dispatch:
    types: [ost-readme-updated]
  schedule:
    - cron: "0 5 * * *"  # 05:00 UTC daily
  workflow_dispatch:

# Merges often land in bursts; one refresh at a time, and the newest wins.
concurrency:
  group: update-data
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: 🧭 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: ⚙️ Install dependencies
        run: |
          python -m pip install --upgrade pip requests pandas

      # The same script that builds OST's monthly release
      # CSVs, minus the Grist upload, so data/*.csv has the exact columns the
      # payload builder expects.
      - name: 🧭 Checkout open-sustainable-technology
        uses: actions/checkout@v4
        with:
          repository: protontypes/open-sustainable-technology
          # Set the OST_REF repo variable to an OST branch to run that
          # branch's script instead of main's (e.g. before a release_dataset.py
          # change is merged there). Unset, this is main.
          ref: ${{ vars.OST_REF || 'main' }}
          path: ost
          persist-credentials: false

      - name: 📥 Build CSVs from ecosyste.ms
        working-directory: ost
        run: |
          python .github/workflows/release_dataset.py --csv-only
          cp projects.csv ../data/projects.csv
          cp organizations.csv ../data/organizations.csv

      - name: 📝 Commit & push updated data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add data/projects.csv data/organizations.csv

          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "📦 Update projects.csv and organizations.csv from ecosyste.ms"
            git push origin HEAD:${GITHUB_REF#refs/heads/}
          fi
